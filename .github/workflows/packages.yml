name: packages

on:
  push:
  pull_request:

jobs:
  create:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: conan-io/setup-conan@v1

      - name: rust
        run: conan create rust/all --version 1.97.1

      - name: zenoh-c
        run: conan create zenoh-c/all --version 1.10.1

      - name: zenoh-pico
        run: conan create zenoh-pico/all --version 1.10.1

      - name: zenoh-cpp
        run: conan create zenoh-cpp/all --version 1.10.1 -s:a compiler.cppstd=17
